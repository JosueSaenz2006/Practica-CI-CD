apiVersion: v1
kind: Service
metadata:
  name: inventario-app
  labels:
    app: inventario-app
spec:
  type: NodePort
  # El cambio de trafico blue-green se hace solo aqui: slot: blue <-> slot: green.
  # No se fijan clusterIP ni nodePort: al aplicar sobre el Service existente se conservan.
  selector:
    app: inventario-app
    slot: green
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
