name: CI/CD Inventario

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Referencia completa en minusculas: GHCR rechaza mayusculas y
  # ${{ github.repository }} devolveria "JosueSaenz2006/Practica-CI-CD".
  IMAGE_NAME: ghcr.io/josuesaenz2006/practica-ci-cd

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias (build reproducible)
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  build-push:
    name: build-push
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Definir referencias de imagen
        run: |
          echo "SHA_IMAGE=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=${IMAGE_NAME}:latest" >> "$GITHUB_ENV"
          # Fecha del commit, no del runner: mismo commit produce el mismo valor.
          echo "BUILD_CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Construir imagen local (sin publicar)
        run: |
          docker build \
            --pull \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created="${BUILD_CREATED}" \
            -t "${SHA_IMAGE}" \
            .

      # Barrera bloqueante: nada se publica si esta accion falla.
      # Se fija por SHA de commit porque las etiquetas de GitHub son mutables.
      - name: Escanear imagen con Trivy (bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SHA_IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          scanners: vuln
          timeout: 10m

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar latest
        run: docker tag "${SHA_IMAGE}" "${LATEST_IMAGE}"

      - name: Publicar etiqueta SHA
        run: docker push "${SHA_IMAGE}"

      - name: Publicar etiqueta latest
        run: docker push "${LATEST_IMAGE}"

      - name: Verificar referencias publicadas
        run: |
          echo "--- Digests reportados por Docker tras el push ---"
          docker image inspect "${SHA_IMAGE}" --format '{{range .RepoDigests}}{{println .}}{{end}}'
          docker image inspect "${LATEST_IMAGE}" --format '{{range .RepoDigests}}{{println .}}{{end}}'
          echo "--- Etiquetas locales ---"
          docker image ls "${IMAGE_NAME}"
